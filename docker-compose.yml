services:
  # ─── Reverse Proxy & Load Balancer ──────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nextjs-app:
        condition: service_started
    restart: unless-stopped
    networks:
      - codelens-network

  # ─── Next.js Application ───────────────────
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL}
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    env_file: .env.local
    environment:
      - NODE_ENV=production
      - INNGEST_EVENT_API_URL=http://inngest-server:8288
      - INNGEST_SERVE_HOST=http://nextjs-app:3000
    expose:
      - "3000"
    depends_on:
      inngest-server:
        condition: service_started
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - codelens-network

  # ─── Inngest Background Job Server ─────────
  inngest-server:
    image: inngest/inngest:latest
    command: >
      inngest dev
      -u http://nextjs-app:3000/api/inngest
      --no-discovery
    ports:
      - "8288:8288"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    networks:
      - codelens-network

  # ─── Redis (Inngest State Store) ────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.15"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - codelens-network

volumes:
  redis_data:
    driver: local

networks:
  codelens-network:
    driver: bridge
