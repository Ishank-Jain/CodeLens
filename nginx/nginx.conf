events {
    worker_connections 1024;
}

http {
    # ─── MIME types (CRITICAL — was missing!) ─────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Hide nginx version from responses ────────
    server_tokens off;

    # ─── Upstream: Next.js app replicas ───────────
    upstream nextjs_upstream {
        least_conn;
        server nextjs-app:3000;
    }

    # ─── Logging ──────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── Performance ─────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ─── Request size & buffer limits (anti-DoS) ─
    client_body_buffer_size    16k;
    client_header_buffer_size  1k;
    large_client_header_buffers 4 8k;
    client_body_timeout        12s;
    client_header_timeout      12s;
    send_timeout               10s;

    # ─── Gzip Compression ────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ─── Rate Limiting ───────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

    # ─── Main Server ─────────────────────────────
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.clerk.accounts.dev https://*.convex.cloud; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.clerk.com https://img.clerk.com; connect-src 'self' https://*.convex.cloud https://*.clerk.accounts.dev wss://*.convex.cloud https://api.github.com; frame-src 'self' https://*.clerk.accounts.dev; font-src 'self' data:;" always;
        # Removed X-XSS-Protection — deprecated, CSP replaces it

        # Max upload size
        client_max_body_size 10M;

        # ─── Block dotfile access (.env, .git, etc.) ─
        location ~ /\. {
            deny all;
            return 404;
        }

        # ─── Static assets (cached aggressively) ────
        location /_next/static {
            proxy_pass http://nextjs_upstream;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ─── Public assets ──────────────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            proxy_pass http://nextjs_upstream;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # ─── API routes (rate limited) ──────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Longer timeout for Inngest webhook processing
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ─── All other routes (Next.js pages) ───────
        location / {
            limit_req zone=general burst=40 nodelay;
            limit_req_status 429;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ─── Health check endpoint ──────────────────
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
